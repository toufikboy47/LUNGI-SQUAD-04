<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamorig Photos - Upload & Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #fff;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            color: #a0a0a0;
            font-size: 16px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            border-color: transparent;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Upload Section */
        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .upload-area {
            border: 3px dashed rgba(233, 69, 96, 0.5);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(233, 69, 96, 0.05);
        }

        .upload-area:hover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
            transform: scale(1.01);
        }

        .upload-area.dragover {
            border-color: #ff6b6b;
            background: rgba(233, 69, 96, 0.15);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }

        .upload-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .upload-area h3 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #a0a0a0;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            margin-top: 30px;
            display: none;
        }

        .preview-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.3);
        }

        .preview-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-info p {
            color: #fff;
            font-size: 14px;
        }

        .preview-info .file-size {
            color: #a0a0a0;
            font-size: 13px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .remove-btn {
            flex: 1;
            padding: 15px;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 2px solid #ff6b6b;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #ff6b6b;
            color: white;
        }

        .upload-btn {
            flex: 2;
            padding: 15px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }

        .upload-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Gallery Section */
        .gallery-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .gallery-header h2 {
            color: #fff;
            font-size: 24px;
        }

        .photo-count {
            color: #a0a0a0;
            font-size: 14px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        .gallery-item-overlay p {
            color: #fff;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-gallery {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-gallery svg {
            width: 80px;
            height: 80px;
            fill: rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .empty-gallery p {
            color: #a0a0a0;
            font-size: 16px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .lightbox-close svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Success Toast */
        .success-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
            transition: transform 0.3s ease;
            z-index: 1001;
        }

        .success-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }
            
            .container {
                padding: 10px;
            }
            
            .tabs {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
            .tab-btn {
                width: 100%;
                max-width: 250px;
                padding: 12px 30px;
            }
            
            .upload-section, .gallery-section {
                padding: 20px;
            }
            
            .upload-area {
                padding: 40px 20px;
            }
            
            .upload-icon {
                width: 60px;
                height: 60px;
            }
            
            .upload-icon svg {
                width: 30px;
                height: 30px;
            }
            
            .upload-area h3 {
                font-size: 18px;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            
            .preview-image {
                max-height: 250px;
            }
            
            .btn-group {
                flex-direction: column;
                gap: 10px;
            }
            
            .remove-btn, .upload-btn {
                width: 100%;
                flex: none;
            }
            
            .lightbox-close {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }
            
            .header p {
                font-size: 14px;
            }
            
            .gallery-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 LUNGI SQUAD 04</h1>
            <p>Upload and view your memorable photos</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="upload">Upload</button>
            <button class="tab-btn" data-tab="gallery">Gallery</button>
        </div>

        <!-- Upload Section -->
        <div class="tab-content active" id="upload">
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                        </svg>
                    </div>
                    <h3>Drop your photo here</h3>
                    <p>or click to browse • PNG, JPG, GIF supported</p>
                </div>
                <input type="file" id="fileInput" accept="image/*">

                <div class="preview-section" id="previewSection">
                    <div class="preview-card">
                        <img class="preview-image" id="previewImage" src="" alt="Preview">
                        <div class="preview-info">
                            <p id="fileName">filename.jpg</p>
                            <p class="file-size" id="fileSize">0 KB</p>
                        </div>
                        <div class="btn-group">
                            <button class="remove-btn" id="removeBtn">Remove</button>
                            <button class="upload-btn" id="uploadBtn">Upload Photo</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gallery Section -->
        <div class="tab-content" id="gallery">
            <div class="gallery-section">
                <div class="gallery-header">
                    <h2>My Photos</h2>
                    <span class="photo-count" id="photoCount">0 photos</span>
                </div>
                <div class="gallery-grid" id="galleryGrid">
                    <div class="empty-gallery">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                        <p>No photos yet. Start uploading!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
        <img class="lightbox-content" id="lightboxImage" src="" alt="Full size">
    </div>

    <!-- Success Toast -->
    <div class="success-toast" id="successToast">✅ Photo uploaded successfully!</div>

    <script>
        // Photo storage (in memory)
        let photos = JSON.parse(localStorage.getItem('mamorigPhotos') || '[]');

        // DOM Elements
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeBtn = document.getElementById('removeBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const galleryGrid = document.getElementById('galleryGrid');
        const photoCount = document.getElementById('photoCount');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxClose = document.getElementById('lightboxClose');
        const successToast = document.getElementById('successToast');

        let selectedFile = null;

        // Tab switching
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(tab).classList.add('active');
                
                if (tab === 'gallery') {
                    renderGallery();
                }
            });
        });

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Handle file selection
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }

            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                previewSection.classList.add('active');
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Remove photo
        removeBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            previewSection.classList.remove('active');
            uploadBtn.disabled = true;
        });

        // Upload button
        uploadBtn.addEventListener('click', () => {
            if (selectedFile) {
                uploadBtn.textContent = 'Uploading...';
                uploadBtn.disabled = true;

                setTimeout(() => {
                    // Create photo object
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const photo = {
                            id: Date.now(),
                            name: selectedFile.name,
                            data: e.target.result,
                            size: selectedFile.size,
                            date: new Date().toLocaleDateString()
                        };
                        
                        photos.unshift(photo);
                        localStorage.setItem('mamorigPhotos', JSON.stringify(photos));
                        
                        // Show success
                        showSuccessToast();
                        
                        // Reset form
                        selectedFile = null;
                        fileInput.value = '';
                        previewSection.classList.remove('active');
                        uploadBtn.disabled = true;
                        uploadBtn.textContent = 'Upload Photo';
                    };
                    reader.readAsDataURL(selectedFile);
                }, 1000);
            }
        });

        // Show success toast
        function showSuccessToast() {
            successToast.classList.add('show');
            setTimeout(() => {
                successToast.classList.remove('show');
            }, 3000);
        }

        // Render gallery
        function renderGallery() {
            photoCount.textContent = `${photos.length} photo${photos.length !== 1 ? 's' : ''}`;
            
            if (photos.length === 0) {
                galleryGrid.innerHTML = `
                    <div class="empty-gallery">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                        <p>No photos yet. Start uploading!</p>
                    </div>
                `;
                return;
            }

            galleryGrid.innerHTML = photos.map(photo => `
                <div class="gallery-item" onclick="openLightbox('${photo.data}')">
                    <img src="${photo.data}" alt="${photo.name}">
                    <div class="gallery-item-overlay">
                        <p>${photo.name}</p>
                    </div>
                </div>
            `).join('');
        }

        // Lightbox functions
        function openLightbox(src) {
            lightboxImage.src = src;
            lightbox.classList.add('active');
        }

        lightboxClose.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });

        // Initial render
        renderGallery();
    </script>
</body>
</html>
